<script>
(function(){
  var START=Date.parse("2026-10-31T03:00:00+03:00"),DUR=864e5,END=START+DUR;
  var demo=location.hash==="#demo",t0=Date.now();
  function $(i){return document.getElementById(i)}
  function nowT(){var n=Date.now(),m=/^#h(\d+)$/.exec(location.hash);
    if(m)return START+(Math.min(24,Math.max(1,+m[1]))-1)*36e5+(n-t0);
    return demo?START-10000+(n-t0):n}
  function digits(ms){var s=Math.max(0,Math.floor(ms/1000)),v=[Math.floor(s/3600),Math.floor(s%3600/60),s%60];
    for(var i=0;i<3;i++){var t=(v[i]<10?"0":"")+v[i];$("d"+2*i).textContent=t[0];$("d"+(2*i+1)).textContent=t[1]}}
  function tick(){var n=nowT(),lab,w=0;
    if(n<START){digits(START-n);lab="Starts in"}
    else if(n<END){var el=n-START;digits(END-n);lab="Hour "+(Math.floor(el/36e5)+1)+".";w=el/DUR}
    else{digits(0);lab="Hour 24.";w=1}
    $("bar").setAttribute("width",(897*w).toFixed(1));
  }
  tick();setInterval(tick,250);
})();
