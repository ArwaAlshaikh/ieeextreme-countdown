  var DUR=864e5,KEY="ieeextreme20-upcount-start",h=location.hash,calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var MSG=["hello, world. let's go!", "warming up the brain", "coffee++", "read every problem first", "first AC? keep going", "debugging is a lifestyle", "drink some water, coder", "1/3 done. nice.", "segfaults build character", "stretch break. 2 min.", "almost halfway", "halfway there!", "night shift mode: ON", "eat something. really.", "trust the test cases", "sunrise is coming", "2/3 done. still awake?", "fresh eyes, fresh ideas", "keep submitting", "final stretch", "check the edge cases", "last push, team!", "one hour left!", "final hour. go go go!"],NS="http://www.w3.org/2000/svg";
  function $(i){return document.getElementById(i)}
  var START=null;
  try{var v=localStorage.getItem(KEY);if(v&&!isNaN(+v))START=+v}catch(e){}
  var m=/^#h(\d+)$/.exec(h);if(m)START=Date.now()-(Math.min(24,Math.max(1,+m[1]))-1)*36e5;
  if(h==="#end")START=Date.now()-DUR+10000;
  /* binary rain columns */
  var cells=[],BX=[96, 128, 160, 1760, 1792, 1824],BY=[125, 161, 197, 233, 269, 305, 341, 377, 413, 449, 485, 521, 557, 593, 629, 665, 701, 737, 773, 809, 845, 881, 917, 953, 989];
  function pick(){var r=Math.random();return r<.1?"b o":r<.24?"b w":"b"}
  BX.forEach(function(x){BY.forEach(function(y){var t=document.createElementNS(NS,"text");
    t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("font-size","26");t.setAttribute("class",pick());
    t.textContent=Math.random()<.5?"0":"1";$("bin").appendChild(t);cells.push(t)})});
  if(!calm)setInterval(function(){for(var k=0;k<4;k++){var c=cells[Math.floor(Math.random()*cells.length)];
    c.textContent=c.textContent==="0"?"1":"0";c.setAttribute("class",pick())}},110);
  /* digits */
  var prev={},shown="",target="",typer=null,phase=null,root=$("stage"),lastSeg=-2;
  function setD(id,c){if(prev[id]===c)return;var e=$(id),first=prev[id]===undefined;prev[id]=c;e.textContent=c;
    if(first||calm)return;e.classList.remove("pop");e.getBoundingClientRect();e.classList.add("pop")}
  function digits(ms){var s=Math.max(0,Math.floor(ms/1000)),v=[Math.min(99,Math.floor(s/3600)),Math.floor(s%3600/60),s%60],ids=["H","M","S"];
    for(var i=0;i<3;i++){var t=(v[i]<10?"0":"")+v[i];setD(ids[i]+"a",t[0]);setD(ids[i]+"b",t[1])}return s}
  /* terminal line */
  function render(){$("term").textContent=shown+(Math.floor(Date.now()/500)%2?" ":"_")}
  function say(txt){if(txt===target)return;target=txt;clearInterval(typer);var k=0;
    if(calm){shown=txt;render();return}
    typer=setInterval(function(){k++;shown=target.slice(0,k);render();if(k>=target.length)clearInterval(typer)},38)}
  /* confetti at kickoff and at the finish */
  function confetti(){if(calm)return;var c=$("fx"),x=c.getContext("2d"),r=devicePixelRatio||1,W=c.width=innerWidth*r,H=c.height=innerHeight*r,P=[],C=["#fdc72f","#ffffff","#f0913a","#9baad1"];
    for(var i=0;i<200;i++)P.push({x:W/2+(Math.random()-.5)*W*.4,y:H*.45,vx:(Math.random()-.5)*W*.022,vy:-(Math.random()*.022+.006)*H,s:(4+Math.random()*6)*r,a:Math.random()*6,va:(Math.random()-.5)*.35,c:C[i%4],b:Math.random()<.3});
    var t=0;(function f(){t++;x.clearRect(0,0,W,H);for(var i=0;i<P.length;i++){var p=P[i];p.vy+=H*.0005;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
      if(p.b){x.font="bold "+(p.s*3)+"px monospace";x.fillText(i%2?"1":"0",0,0)}else x.fillRect(-p.s,-p.s/2.5,p.s*2,p.s/1.25);
      x.restore()}if(t<320)requestAnimationFrame(f);else x.clearRect(0,0,W,H)})()}
  function segs(n){if(n===lastSeg)return;lastSeg=n;for(var i=0;i<24;i++)$("s"+i).setAttribute("class","seg"+(i<n?" on":i===n?" now":""))}
  function pad(n){return (n<10?"0":"")+n}
  function clock(el){var hr=Math.min(24,Math.floor(el/36e5)+1),r=Math.floor(el/1000)%3600,v=[hr,Math.floor(r/60),r%60],ids=["H","M","S"];
    for(var i=0;i<3;i++){var t=pad(v[i]);setD(ids[i]+"a",t[0]);setD(ids[i]+"b",t[1])}}
  function begin(){if(START)return;START=Date.now();try{localStorage.setItem(KEY,String(START))}catch(e){}confetti();tick()}
  function reset(){START=null;phase=null;try{localStorage.removeItem(KEY)}catch(e){}tick()}
  $("startui").addEventListener("click",begin);
  $("reset").addEventListener("dblclick",reset);
  addEventListener("keydown",function(e){if(!START&&(e.code==="Space"||e.key==="Enter")){e.preventDefault();begin()}});
  function tick(){var n=Date.now(),msg,ph,lab,el=0;
    if(!START){clock(0);ph="pre";lab="PRESS START";msg="$ ./ieeextreme --start";segs(-1)}
    else{el=Math.min(DUR,Math.max(0,n-START));
      if(el<DUR){var hr=Math.floor(el/36e5)+1;clock(el);ph="run";lab="HOUR "+hr+" OF 24";msg="h"+pad(hr)+" $ "+MSG[hr-1];segs(hr-1)}
      else{setD("Ha","2");setD("Hb","4");setD("Ma","0");setD("Mb","0");setD("Sa","0");setD("Sb","0");ph="end";lab="TIME\u2019S UP";msg="$ exit 0  // GG, everyone!";segs(24)}}
    if(phase==="run"&&ph==="end")confetti();
    phase=ph;
    $("startui").style.display=START?"none":"";
    if($("status").textContent!==lab)$("status").textContent=lab;
    var hd=$("hand");if(hd)hd.setAttribute("transform","rotate("+(ph==="run"?(Math.floor(el/6e4)%60)*6:0)+")");
    say(msg);render()}
  tick();setInterval(tick,250);
})();
</script>
</body>
</html>
